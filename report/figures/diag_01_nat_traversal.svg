<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520">
  <defs>
    <filter id="cShadow1" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>

    <linearGradient id="gHomeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" /><stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
    <linearGradient id="gCloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" /><stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="gWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" /><stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Markers -->
    <marker id="mGreen1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="mRed1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="mBlue1" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .title { font-size: 19px; font-weight: 800; fill: #0f172a; }
    .subtitle { font-size: 12px; fill: #64748b; }
    .label { font-size: 11px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .sub { font-size: 9.5px; fill: #64748b; text-anchor: middle; }
    .flow-badge { font-size: 9.5px; font-weight: 800; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="520" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(40, 24)">
    <rect width="28" height="28" rx="6" fill="#7c3aed" />
    <path d="M 7 14 L 21 14 M 14 7 L 21 14 L 14 21" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <text x="38" y="18" class="title">Carrier-Grade NAT (CGNAT) Traversal via Outbound Reverse Tunneling</text>
    <text x="38" y="34" class="subtitle">Home edge initiates an outbound TLS 1.3 reverse tunnel to the public cloud relay, completely eliminating inbound port-forwarding</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 1. HOME RESIDENTIAL SUBNET (LEFT) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 75)" filter="url(#cShadow1)">
    <!-- Boundary Pill -->
    <rect width="330" height="420" rx="14" fill="url(#gHomeBg)" stroke="#d8b4fe" stroke-width="1.5" />
    <rect x="20" y="14" width="220" height="24" rx="12" fill="#7c3aed" />
    <text x="130" y="30" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">🏠 HOME EDGE (192.168.1.0/24)</text>

    <!-- Edge Server Host Chassis -->
    <g transform="translate(100, 55)">
      <rect width="130" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
      <rect x="14" y="16" width="60" height="14" rx="2" fill="#0f172a" stroke="#64748b" />
      <rect x="14" y="36" width="60" height="14" rx="2" fill="#0f172a" stroke="#64748b" />
      <rect x="14" y="56" width="60" height="14" rx="2" fill="#0f172a" stroke="#64748b" />
      <circle cx="92" cy="24" r="3.5" fill="#10b981" />
      <circle cx="106" cy="24" r="3.5" fill="#38bdf8" />
      <text x="65" y="112" class="label">Home Server (edged)</text>
      <text x="65" y="125" class="sub">Mini-Jellyfin (:8089)</text>
    </g>

    <!-- Local Media Storage Cylinder -->
    <g transform="translate(25, 205)">
      <ellipse cx="40" cy="16" rx="32" ry="10" fill="#818cf8" stroke="#4f46e5" stroke-width="1.5" />
      <rect x="8" y="16" width="64" height="42" fill="#4338ca" />
      <ellipse cx="40" cy="58" rx="32" ry="10" fill="#3730a3" stroke="#4f46e5" stroke-width="1.5" />
      <ellipse cx="40" cy="16" rx="28" ry="8" fill="#a5b4fc" />
      <text x="40" y="86" class="label">NVMe Storage</text>
      <text x="40" y="99" class="sub">Master HLS at Home</text>
    </g>

    <!-- Local LAN Client Monitor Screen -->
    <g transform="translate(195, 205)">
      <rect x="8" y="8" width="80" height="52" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1.2" />
      <rect x="12" y="12" width="72" height="44" rx="2" fill="#064e3b" />
      <polygon points="44,28 44,42 56,35" fill="#34d399" />
      <path d="M 42 60 L 54 60 L 58 72 L 38 72 Z" fill="#475569" />
      <text x="48" y="92" class="label">LAN Viewers</text>
      <text x="48" y="105" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">Sub-4ms Direct Wi-Fi</text>
    </g>

    <!-- Wi-Fi Path from Server to LAN Client -->
    <path d="M 165 145 L 165 185 L 235 185 L 235 205" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#mGreen1)" />
    <text x="195" y="178" font-size="8" font-weight="700" fill="#047857">LAN Bypass</text>

    <!-- Port Forwarding Badge at Bottom -->
    <rect x="25" y="360" width="280" height="36" rx="6" fill="#ecfdf5" stroke="#86efac" />
    <text x="165" y="378" font-size="10.5" font-weight="800" fill="#065f46" text-anchor="middle">🔒 ZERO INBOUND PORTS REQUIRED</text>
    <text x="165" y="390" font-size="8.5" fill="#047857" text-anchor="middle">CGNAT &amp; ISP Strict Firewall Immune</text>
  </g>

  <!-- ========================================================================= -->
  <!-- 2. ISP CGNAT & FIREWALL (CENTER BARRIER) -->
  <!-- ========================================================================= -->
  <g transform="translate(410, 75)" filter="url(#cShadow1)">
    <!-- Firewall Wall Graphic -->
    <rect width="180" height="420" rx="14" fill="#fff1f2" stroke="#fca5a5" stroke-width="1.5" />
    
    <!-- Header Title -->
    <rect x="15" y="14" width="150" height="24" rx="12" fill="#dc2626" />
    <text x="90" y="30" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">🔥 ISP CGNAT BARRIER</text>
    <text x="90" y="52" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">RFC 6598 (100.64.0.0/10)</text>

    <!-- Upper Section: Inbound Block -->
    <g transform="translate(15, 65)">
      <rect width="150" height="135" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2" />
      <!-- Shield Graphic -->
      <path d="M 75 12 Q 95 4 105 12 Q 105 45 75 60 Q 45 45 45 12 Z" fill="url(#gWall)" />
      <text x="75" y="38" font-size="18" fill="#ffffff" font-weight="900" text-anchor="middle">✕</text>
      
      <text x="75" y="80" font-size="10.5" font-weight="800" fill="#991b1b" text-anchor="middle">INBOUND BLOCKED</text>
      <text x="75" y="96" font-size="9" fill="#64748b" text-anchor="middle">Direct TCP SYN Dropped</text>
      <text x="75" y="110" font-size="9" fill="#64748b" text-anchor="middle">No Public Home IPv4</text>
      <text x="75" y="124" font-size="8.5" font-weight="700" fill="#be123c" text-anchor="middle">Port Forwarding Fails</text>
    </g>

    <!-- Lower Section: Stateful Outbound Pass -->
    <g transform="translate(15, 230)">
      <rect width="150" height="165" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
      <!-- Green Padlock / Pipe Graphic -->
      <circle cx="75" cy="30" r="18" fill="#10b981" />
      <text x="75" y="36" font-size="16" fill="#ffffff" font-weight="900" text-anchor="middle">✓</text>
      
      <text x="75" y="68" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle">OUTBOUND PASS</text>
      <text x="75" y="86" font-size="9" fill="#047857" text-anchor="middle">Persistent TLS 1.3 Conduit</text>
      <text x="75" y="100" font-size="9" fill="#047857" text-anchor="middle">Reverse Tunneling (FRP)</text>
      <text x="75" y="116" font-size="8.5" font-weight="700" fill="#15803d" text-anchor="middle">Stateful NAT Mapping</text>
      
      <!-- Port info badge -->
      <rect x="15" y="128" width="120" height="24" rx="4" fill="#ffffff" stroke="#86efac" />
      <text x="75" y="144" font-size="8.5" font-weight="700" fill="#065f46" text-anchor="middle">Outbound Port :7000</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 3. PUBLIC CLOUD RELAY & ORIGIN SHIELD (RIGHT) -->
  <!-- ========================================================================= -->
  <g transform="translate(630, 75)" filter="url(#cShadow1)">
    <!-- Cloud Container Box -->
    <rect width="530" height="420" rx="14" fill="url(#gCloudBg)" stroke="#7dd3fc" stroke-width="1.5" />
    
    <!-- Cloud Title Pill -->
    <rect x="25" y="14" width="280" height="24" rx="12" fill="#0284c7" />
    <text x="165" y="30" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">☁️ PUBLIC CLOUD TIER (GCP VM / RELAY)</text>

    <!-- Top Row: Cloud Services -->
    <!-- 1. FRP Server -->
    <g transform="translate(25, 60)">
      <rect width="145" height="95" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />
      <rect x="10" y="10" width="125" height="22" rx="4" fill="#e0f2fe" />
      <text x="72.5" y="25" font-size="10" font-weight="800" fill="#0369a1" text-anchor="middle">FRP SERVER (frps)</text>
      <text x="72.5" y="50" font-size="9" fill="#64748b" text-anchor="middle">Listens on :7000 (TLS)</text>
      <text x="72.5" y="65" font-size="9" fill="#64748b" text-anchor="middle">Multiplexed Tunnel Hub</text>
      <text x="72.5" y="82" font-size="8.5" font-weight="700" fill="#0284c7" text-anchor="middle">Reverse Pull Gateway</text>
    </g>

    <!-- 2. Stream Router & API -->
    <g transform="translate(190, 60)">
      <rect width="150" height="95" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5" />
      <rect x="10" y="10" width="130" height="22" rx="4" fill="#eef2ff" />
      <text x="75" y="25" font-size="10" font-weight="800" fill="#3730a3" text-anchor="middle">STREAM ROUTER (apid)</text>
      <text x="75" y="50" font-size="9" fill="#64748b" text-anchor="middle">Subnet Proximity Router</text>
      <text x="75" y="65" font-size="9" fill="#64748b" text-anchor="middle">10-Stream Limiter Cap</text>
      <text x="75" y="82" font-size="8.5" font-weight="700" fill="#4f46e5" text-anchor="middle">Short-Lived HMAC Tokens</text>
    </g>

    <!-- 3. Origin Shield S3 Cache -->
    <g transform="translate(360, 60)">
      <rect width="145" height="95" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5" />
      <rect x="10" y="10" width="125" height="22" rx="4" fill="#fef3c7" />
      <text x="72.5" y="25" font-size="10" font-weight="800" fill="#92400e" text-anchor="middle">ORIGIN SHIELD CACHE</text>
      <text x="72.5" y="50" font-size="9" fill="#64748b" text-anchor="middle">S3 24h LRU Buffer</text>
      <text x="72.5" y="65" font-size="9" fill="#64748b" text-anchor="middle">Single-Ingest Upload</text>
      <text x="72.5" y="82" font-size="8.5" font-weight="700" fill="#d97706" text-anchor="middle">Zero Permanent Storage</text>
    </g>

    <!-- Service Connectors -->
    <path d="M 170 107 L 190 107" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#mBlue1)" />
    <path d="M 340 107 L 360 107" fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#mBlue1)" />

    <!-- Bottom Section: Public Community Viewers -->
    <g transform="translate(25, 195)">
      <rect width="480" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
      
      <!-- Title -->
      <rect x="15" y="12" width="220" height="22" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="25" y="27" font-size="10.5" font-weight="800" fill="#0f172a">👥 Public Community Viewers (10x Load)</text>

      <!-- Viewer Devices Illustration -->
      <g transform="translate(30, 48)">
        <!-- Laptop -->
        <g transform="translate(0, 5)">
          <rect width="56" height="36" rx="3" fill="#1e293b" />
          <rect x="3" y="3" width="50" height="30" rx="1" fill="#38bdf8" />
          <polygon points="25,12 25,24 35,18" fill="#ffffff" />
          <rect x="-6" y="36" width="68" height="6" rx="1" fill="#64748b" />
          <text x="28" y="54" font-size="8.5" fill="#64748b" text-anchor="middle">Viewer 1</text>
        </g>

        <!-- Smartphone 1 -->
        <g transform="translate(90, 8)">
          <rect width="24" height="42" rx="4" fill="#1e293b" />
          <rect x="2" y="3" width="20" height="32" rx="2" fill="#38bdf8" />
          <circle cx="12" cy="38" r="1.5" fill="#94a3b8" />
          <text x="12" y="52" font-size="8.5" fill="#64748b" text-anchor="middle">Viewer 2</text>
        </g>

        <!-- Smartphone 2 -->
        <g transform="translate(140, 8)">
          <rect width="24" height="42" rx="4" fill="#1e293b" />
          <rect x="2" y="3" width="20" height="32" rx="2" fill="#38bdf8" />
          <circle cx="12" cy="38" r="1.5" fill="#94a3b8" />
          <text x="12" y="52" font-size="8.5" fill="#64748b" text-anchor="middle">Viewer 3</text>
        </g>

        <!-- Tablet -->
        <g transform="translate(190, 5)">
          <rect width="44" height="36" rx="3" fill="#1e293b" />
          <rect x="3" y="3" width="38" height="30" rx="1" fill="#38bdf8" />
          <polygon points="19,12 19,24 27,18" fill="#ffffff" />
          <text x="22" y="54" font-size="8.5" fill="#64748b" text-anchor="middle">Viewer 4</text>
        </g>

        <text x="260" y="30" font-size="18" font-weight="900" fill="#0284c7">. . .</text>

        <!-- Viewer 10 Desktop -->
        <g transform="translate(310, 5)">
          <rect width="52" height="34" rx="2" fill="#1e293b" />
          <rect x="3" y="3" width="46" height="26" rx="1" fill="#38bdf8" />
          <polygon points="23,10 23,20 31,15" fill="#ffffff" />
          <rect x="22" y="34" width="8" height="7" fill="#64748b" />
          <rect x="15" y="41" width="22" height="3" fill="#64748b" />
          <text x="26" y="54" font-size="8.5" fill="#64748b" text-anchor="middle">Viewer 10</text>
        </g>
      </g>

      <!-- Origin Shield Fan-out Callout -->
      <g transform="translate(20, 125)">
        <rect width="440" height="58" rx="6" fill="#f0fdf4" stroke="#86efac" />
        <text x="16" y="22" font-size="11" font-weight="800" fill="#166534">⚡ Origin Shield Bandwidth Absorption:</text>
        <text x="16" y="38" font-size="9.5" fill="#047857">• Viewer 1 triggers single-ingest pull via reverse tunnel (1x Uplink: ~2.5 MB)</text>
        <text x="16" y="52" font-size="9.5" fill="#047857">• Viewers 2 through 10 served directly from Cloud Cache (90% Home Bandwidth Saved)</text>
      </g>
    </g>

    <!-- Connector from Cache down to Viewers -->
    <path d="M 432 155 L 432 195" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#mBlue1)" />
  </g>

  <!-- ========================================================================= -->
  <!-- HIGHWAYS / CONDUITS ACROSS THE FIREWALL (NO OVERLAPS) -->
  <!-- ========================================================================= -->

  <!-- 1. TOP PATH: BLOCKED INBOUND ATTEMPT -->
  <g>
    <path d="M 655 170 L 490 170" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#mRed1)" />
    <!-- Label Banner above arrow -->
    <rect x="495" y="145" width="130" height="20" rx="4" fill="#fee2e2" stroke="#fca5a5" />
    <text x="560" y="159" font-size="9" font-weight="800" fill="#991b1b" text-anchor="middle">① Inbound SYN Dropped</text>
  </g>

  <!-- 2. BOTTOM PATH: OUTBOUND TLS REVERSE TUNNEL -->
  <g>
    <path d="M 370 380 L 415 380" fill="none" stroke="#10b981" stroke-width="3.5" />
    <path d="M 415 380 L 590 380" fill="none" stroke="#10b981" stroke-width="3.5" stroke-dasharray="6,4" />
    <path d="M 590 380 L 655 380 C 685 380, 700 300, 700 160" fill="none" stroke="#10b981" stroke-width="3.5" marker-end="url(#mGreen1)" />
    
    <!-- Label Banner below arrow -->
    <rect x="420" y="390" width="170" height="22" rx="4" fill="#ecfdf5" stroke="#10b981" />
    <text x="505" y="405" class="flow-badge" fill="#065f46" text-anchor="middle">② Outbound TLS 1.3 Tunnel (FRP)</text>
  </g>

</svg>