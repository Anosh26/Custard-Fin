services:
  postgres:
    image: postgres:16-alpine
    container_name: custardfin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-custard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-custard_secret}
      POSTGRES_DB: ${POSTGRES_DB:-custardfin}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: custardfin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  s3-cache:
    image: pgsty/minio:latest
    container_name: custardfin-cache
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  frps:
    image: snowdreamtech/frps:latest
    container_name: custardfin-frps
    restart: unless-stopped
    ports:
      - "7000:7000"
      - "7500:7500"
      - "8000-8020:8000-8020"
    volumes:
      - ./frps.toml:/etc/frp/frps.toml

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: custardfin-api
    restart: unless-stopped
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-custard}:${POSTGRES_PASSWORD:-custard_secret}@postgres:5432/${POSTGRES_DB:-custardfin}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      S3_ENDPOINT: "http://s3-cache:9000"
      S3_BUCKET: "${S3_BUCKET:-custardfin-origin-cache}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-minioadmin}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-minioadmin}"
      JWT_SECRET: "${JWT_SECRET:-custardfin_demo_jwt_secret_key_32_bytes!!}"
      FRP_SERVER_ADDR: "frps"
      FRP_SERVER_PORT: "7000"
      FRP_AUTH_TOKEN: "${FRP_AUTH_TOKEN:-custardfin_demo_frp_token}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3-cache:
        condition: service_healthy
      frps:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: custardfin-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://api:8080}"
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2.8-alpine
    container_name: custardfin-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  pgdata:
  s3data:
  caddy_data:
  caddy_config:
